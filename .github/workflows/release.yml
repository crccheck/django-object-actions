# https://python-semantic-release.readthedocs.io/en/latest/automatic-releases/github-actions.html#examples
name: Release

on:
  workflow_dispatch:
  # Disabled to be able to roll multiple breaking releases into one release
  # push:
  #   branches:
  #     - main

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup | Force release branch to be at workflow sha
        run: |
          git reset --hard ${{ github.sha }}
      - name: Action | Python Semantic Release
        id: release
        # https://github.com/python-semantic-release/python-semantic-release/releases
        # https://python-semantic-release.readthedocs.io/en/latest/github-action.html
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Publish | Upload package to PyPI
        # https://github.com/pypa/gh-action-pypi-publish/releases
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # NOTE: DO NOT wrap the conditional in ${{ }} as it will always evaluate to true.
        # See https://github.com/actions/runner/issues/1173
        if: steps.release.outputs.released == 'true'

      - name: Publish | Upload to GitHub Release Assets
        # https://github.com/python-semantic-release/publish-action/releases
        uses: python-semantic-release/publish-action@99d4062dd393b5a7a62c5fe9ed78fb364b5674f2 # v10.7.0
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.BOT_GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
