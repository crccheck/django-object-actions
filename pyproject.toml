[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-object-actions"
version = "5.1.2"
description = "A Django app for adding object tools for models in the admin"
authors = [{ name = "crccheck", email = "c@crccheck.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = ["django", "admin"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[project.urls]
"Homepage" = "https://github.com/crccheck/django-object-actions"

[dependency-groups]
dev = [
  "coverage",
  "django",
  "django-extensions",
  "factory-boy",
  "dj-database-url",
  "python-semantic-release",
  "ruff",
]
build = ["build", "twine"]

[tool.setuptools]
packages = ["django_object_actions"]
[tool.setuptools.package-data]
"django_object_actions" = [
  "templates/django_object_actions/*.html",
  "static/django_object_actions/css/*.css",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["django_object_actions/__init__.py:__version__"]
build_command = "pip install --dependency-group build && python -m build"

[tool.semantic_release.changelog]
template_dir = ".github/workflows/release"

[tool.coverage.run]
source = ["django_object_actions"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "__repr__",
  "__unicode__",
  "raise NotImplementedError",
]

[tool.ruff]

[tool.ruff.lint]
extend-select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "G",   # flake8-logging-format
  "I",   # isort
  "N",   # pep8-naming
  "RET", # flakes8-return
  "RUF", # Ruff-specific rules
  "UP",  # pyupgrade
]
ignore = ["RUF012"]
